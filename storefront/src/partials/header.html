<!--
  Reusable storefront header. Included at the top of every page.
  (Vite doesn't do HTML partials natively — we inline this block in each page
  for the static build. Kept here as the source of truth for copy-paste.)
-->
<header class="store-header">
  <div class="container py-3">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <a href="index.html" class="brand d-inline-flex align-items-center gap-2">
        <img src="../../src/assets/images/logo-icon.svg" alt="" width="24" height="24"
             onerror="this.style.display='none'">
        <span>Estrave</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="profile.html" class="btn btn-light btn-sm rounded-circle" title="Account">
          <i class="ti ti-user"></i>
        </a>
      </div>
    </div>
    <form class="store-search" role="search" id="storeSearchForm">
      <i class="ti ti-search"></i>
      <input id="storeSearch" type="search" class="form-control"
             placeholder="Search for products..." autocomplete="off">
    </form>
  </div>
</header>
