<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Estrave — Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#E66239" />
</head>
<body>

  <!-- ========== Header: logo + search ========== -->
  <header class="store-header">
    <div class="container py-3">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <a href="index.html" class="brand d-inline-flex align-items-center gap-2">
          <span class="d-inline-flex align-items-center justify-content-center rounded-2"
                style="width:32px;height:32px;background:var(--bs-primary);color:#fff;">
            <i class="ti ti-shopping-bag"></i>
          </span>
          <span>Estrave</span>
        </a>
        <div class="d-flex align-items-center gap-2">
          <!-- Account button: inline SVG so it renders identically even if the
               Tabler icon webfont hasn't loaded yet. -->
          <a href="profile.html" class="account-btn" title="Account" aria-label="Account">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21c0-4.418 3.582-8 8-8s8 3.582 8 8"></path>
            </svg>
            <span class="account-btn-label d-none d-sm-inline">Account</span>
          </a>
        </div>
      </div>

      <!-- Prominent search bar directly under the logo/name -->
      <form class="store-search" role="search" id="storeSearchForm" onsubmit="return false;">
        <i class="ti ti-search"></i>
        <input id="storeSearch" type="search" class="form-control"
               placeholder="Search for products..." autocomplete="off">
      </form>
    </div>
  </header>

  <main class="container py-3">

    <!-- ========== Horizontal category rail ========== -->
    <nav class="category-rail" id="categoryRail" aria-label="Categories">
      <!-- "All" is the default selection -->
      <button type="button" class="category-chip active" data-category="">All</button>
      <!-- More chips injected by home.js -->
    </nav>

    <!-- ========== Product grid (2 per row) ========== -->
    <section class="mt-2">
      <div id="productGrid" class="product-grid">
        <!-- Skeleton placeholders while loading -->
        <div class="product-card placeholder-glow">
          <div class="product-thumb placeholder"></div>
          <div class="product-body">
            <span class="placeholder col-9 mb-2"></span>
            <span class="placeholder col-5"></span>
          </div>
        </div>
        <div class="product-card placeholder-glow">
          <div class="product-thumb placeholder"></div>
          <div class="product-body">
            <span class="placeholder col-7 mb-2"></span>
            <span class="placeholder col-4"></span>
          </div>
        </div>
      </div>

      <!-- Empty state shown when a search/category yields 0 products -->
      <div id="emptyState" class="empty-state d-none">
        <i class="ti ti-basket-off"></i>
        <p class="mt-2 mb-0">No products match that search.</p>
      </div>
    </section>
  </main>

  <!-- ========== Floating cart FAB ========== -->
  <a href="cart.html" class="cart-fab" aria-label="Open cart">
    <i class="ti ti-shopping-cart"></i>
    <span class="cart-badge" data-cart-count style="display:none;">0</span>
  </a>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
